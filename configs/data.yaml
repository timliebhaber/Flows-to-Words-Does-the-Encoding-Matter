# Data pipeline config (plan §4): loading, cleaning, sampling, dedupe, split, stats.
# Every parameter of src/data/ lives here. Loaded and validated by src/config.py.

paths:
  raw_dir: data/raw                         # raw CSVs (gitignored)
  processed_dir: data/processed             # output: <processed_dir>/<dataset>/<split><split_file_suffix>
  split_file_suffix: .parquet
  dataset_config_dir: configs/datasets      # one YAML per dataset, named <dataset>.yaml
  stats_dir: results/dataset_stats          # per-dataset stats as <dataset>.json
  stats_summary_file: results/dataset_stats.md   # combined Markdown tables for the report

# Datasets processed by `--all`, in this order. Each needs <dataset_config_dir>/<name>.yaml.
datasets:
  - nf_unsw_nb15
  - nf_ton_iot
  - nf_bot_iot
  - nf_cse_cic_ids2018

seeds:
  sampling: 42      # picks which raw rows enter the sample
  split: 42         # train/val/test assignment

sampling:
  sample_size: 200000          # rows per dataset BEFORE dedupe (plan §12 decision: 200k)
  rare_class_threshold: 10000  # classes with fewer raw rows than this are kept whole; others sampled proportionally

cleaning:
  # inf appears in the bytes/sec columns when the flow duration is 0. true -> store it as missing (NaN),
  # so XGBoost treats it as missing and encoders write the NA token. Decided 2026-10-20.
  inf_to_missing: true

dedupe:
  # Rows with identical features but different attack_class ("conflicts"):
  #   drop_all -> remove every row of such a group (label noise; avoids one feature vector in two splits)
  #   keep     -> keep them (one row per distinct label)
  conflict_policy: drop_all
  min_rows_per_class: 20       # after dedupe, classes smaller than this cannot be stratified 70/15/15 and are dropped (logged in stats)

# Split ratios, stratified by the class column. Keys are the split names used for file names. Must sum to 1.
split:
  train: 0.70
  val: 0.15
  test: 0.15

io:
  read_block_size_bytes: 67108864   # 64 MiB per streamed CSV block (memory vs speed only; does not change the sample)

columns:
  label: Label                 # binary label in the raw CSV
  attack: Attack               # raw attack name in the raw CSV
  class: attack_class          # added column: normalized attack name (see label_map in dataset configs)
  row_id: raw_row_id           # added column: 0-based data-row index in the raw CSV (traceability, NEVER a feature)
  benign_class: benign         # normalized name of the benign class
  benign_label_value: 0        # value of `label` for benign rows (the pipeline asserts label == 0 <=> class == benign)

  # Leaky / noise columns (plan §4.3). Dropped at read time, before anything else.
  leaky:
    - IPV4_SRC_ADDR
    - IPV4_DST_ADDR
    - L4_SRC_PORT
    - FLOW_START_MILLISECONDS
    - FLOW_END_MILLISECONDS
    - DNS_QUERY_ID

  # Kept features in their FIXED order (identical for every row and dataset; encoders rely on it).
  # Raw v3 order with the leaky columns removed. L4_DST_PORT is kept on purpose (plan §4.3).
  features:
    - L4_DST_PORT
    - PROTOCOL
    - L7_PROTO
    - IN_BYTES
    - IN_PKTS
    - OUT_BYTES
    - OUT_PKTS
    - TCP_FLAGS
    - CLIENT_TCP_FLAGS
    - SERVER_TCP_FLAGS
    - FLOW_DURATION_MILLISECONDS
    - DURATION_IN
    - DURATION_OUT
    - MIN_TTL
    - MAX_TTL
    - LONGEST_FLOW_PKT
    - SHORTEST_FLOW_PKT
    - MIN_IP_PKT_LEN
    - MAX_IP_PKT_LEN
    - SRC_TO_DST_SECOND_BYTES
    - DST_TO_SRC_SECOND_BYTES
    - RETRANSMITTED_IN_BYTES
    - RETRANSMITTED_IN_PKTS
    - RETRANSMITTED_OUT_BYTES
    - RETRANSMITTED_OUT_PKTS
    - SRC_TO_DST_AVG_THROUGHPUT
    - DST_TO_SRC_AVG_THROUGHPUT
    - NUM_PKTS_UP_TO_128_BYTES
    - NUM_PKTS_128_TO_256_BYTES
    - NUM_PKTS_256_TO_512_BYTES
    - NUM_PKTS_512_TO_1024_BYTES
    - NUM_PKTS_1024_TO_1514_BYTES
    - TCP_WIN_MAX_IN
    - TCP_WIN_MAX_OUT
    - ICMP_TYPE
    - ICMP_IPV4_TYPE
    - DNS_QUERY_TYPE
    - DNS_TTL_ANSWER
    - FTP_COMMAND_RET_CODE
    - SRC_TO_DST_IAT_MIN
    - SRC_TO_DST_IAT_MAX
    - SRC_TO_DST_IAT_AVG
    - SRC_TO_DST_IAT_STDDEV
    - DST_TO_SRC_IAT_MIN
    - DST_TO_SRC_IAT_MAX
    - DST_TO_SRC_IAT_AVG
    - DST_TO_SRC_IAT_STDDEV

  # Features read and stored as text (none in NetFlow; Edge-IIoTset has some, see configs/data_edge.yaml).
  # Dataset configs may rewrite spellings in them (`string_value_map`).
  string_features: []

  # Features stored as float64; every other feature (and `label`) is int64.
  float_features:
    - L7_PROTO
    - SRC_TO_DST_SECOND_BYTES
    - DST_TO_SRC_SECOND_BYTES
