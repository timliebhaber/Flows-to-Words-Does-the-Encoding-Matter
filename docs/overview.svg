<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Flows to Words: overview</title>
  <desc id="desc">One NetFlow record is written as text in four encodings (E1 PPFLE, E2 binned PPFLE, E3 key=value, E4 sentence), which are read by a small BERT trained from scratch and by a pretrained DistilBERT; XGBoost reads the table directly. The IN_BYTES feature is highlighted in every encoding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#184F95"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #1F2937; }
    .muted { fill: #64748B; }
    .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.2; }
    .hl { fill: #B45309; font-weight: 700; }
  </style>

  <!-- background (white card, so it reads the same in light and dark GitHub themes) -->
  <rect x="0.5" y="0.5" width="1199" height="599" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- title -->
  <text x="40" y="52" class="sans" font-size="28" font-weight="700" fill="#184F95">Flows to Words</text>
  <text x="40" y="80" class="sans muted" font-size="15">One network flow, four ways to write it as text, three classifiers to read it.</text>

  <!-- flow record -->
  <g filter="url(#shadow)"><rect x="40" y="110" width="250" height="360" rx="12" class="card"/></g>
  <text x="58" y="141" class="sans ink" font-size="16" font-weight="700">Flow record</text>
  <rect x="200" y="125" width="74" height="22" rx="11" fill="#CDE2FB"/>
  <text x="237" y="140" class="sans" font-size="11.5" font-weight="600" fill="#184F95" text-anchor="middle">47 features</text>
  <rect x="50" y="245" width="230" height="25" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <g class="mono" font-size="12.5">
    <text x="58" y="172" class="muted">L4_DST_PORT</text><text x="272" y="172" class="ink" text-anchor="end">31992</text>
    <text x="58" y="202" class="muted">PROTOCOL</text><text x="272" y="202" class="ink" text-anchor="end">6</text>
    <text x="58" y="232" class="muted">L7_PROTO</text><text x="272" y="232" class="ink" text-anchor="end">11.0</text>
    <text x="58" y="262" fill="#92400E" font-weight="700">IN_BYTES</text><text x="272" y="262" fill="#92400E" font-weight="700" text-anchor="end">4704</text>
    <text x="58" y="292" class="muted">IN_PKTS</text><text x="272" y="292" class="ink" text-anchor="end">28</text>
    <text x="58" y="322" class="muted">OUT_BYTES</text><text x="272" y="322" class="ink" text-anchor="end">2976</text>
    <text x="58" y="352" class="muted">MIN_TTL</text><text x="272" y="352" class="ink" text-anchor="end">31</text>
    <text x="58" y="382" class="muted">MAX_TTL</text><text x="272" y="382" class="ink" text-anchor="end">32</text>
  </g>
  <text x="58" y="418" class="sans muted" font-size="12.5">… and 39 more features</text>
  <text x="58" y="448" class="sans muted" font-size="12" font-style="italic">NF-UNSW-NB15, one training row</text>

  <!-- flow -> encodings -->
  <g fill="none" stroke="#184F95" stroke-width="1.6">
    <path d="M290,290 C315,290 315,153 336,153" marker-end="url(#arrow)"/>
    <path d="M290,290 C315,290 315,251 336,251" marker-end="url(#arrow)"/>
    <path d="M290,290 C315,290 315,349 336,349" marker-end="url(#arrow)"/>
    <path d="M290,290 C315,290 315,447 336,447" marker-end="url(#arrow)"/>
  </g>

  <!-- E1 -->
  <g filter="url(#shadow)"><rect x="340" y="110" width="560" height="86" rx="10" class="card"/></g>
  <rect x="356" y="124" width="34" height="22" rx="6" fill="#6D28D9"/>
  <text x="373" y="140" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">E1</text>
  <text x="400" y="140" class="sans ink" font-size="15" font-weight="700">PPFLE<tspan class="muted" font-size="12.5" font-weight="400" dx="10">IN_BYTES$4704 → SHA-256 → first 16 hex chars</tspan></text>
  <rect x="826" y="124" width="62" height="20" rx="10" fill="#EDE9FE"/>
  <text x="857" y="138" class="sans" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">hashed</text>
  <text x="356" y="178" class="mono ink" font-size="12.5">e61bda9819b7fb55 4fbfe692dd218a7c 49f8efc3a07a7d29 <tspan class="hl">46928dd8ca3a3f99</tspan> …</text>

  <!-- E2 -->
  <g filter="url(#shadow)"><rect x="340" y="208" width="560" height="86" rx="10" class="card"/></g>
  <rect x="356" y="222" width="34" height="22" rx="6" fill="#6D28D9"/>
  <text x="373" y="238" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">E2</text>
  <text x="400" y="238" class="sans ink" font-size="15" font-weight="700">Binned PPFLE<tspan class="muted" font-size="12.5" font-weight="400" dx="10">4704 → quantile bin 8 → IN_BYTES$bin8 → SHA-256</tspan></text>
  <rect x="826" y="222" width="62" height="20" rx="10" fill="#EDE9FE"/>
  <text x="857" y="236" class="sans" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">hashed</text>
  <text x="356" y="276" class="mono ink" font-size="12.5">e61bda9819b7fb55 4fbfe692dd218a7c 49f8efc3a07a7d29 <tspan class="hl">7fc09090edd30595</tspan> …</text>

  <!-- E3 -->
  <g filter="url(#shadow)"><rect x="340" y="306" width="560" height="86" rx="10" class="card"/></g>
  <rect x="356" y="320" width="34" height="22" rx="6" fill="#0F766E"/>
  <text x="373" y="336" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">E3</text>
  <text x="400" y="336" class="sans ink" font-size="15" font-weight="700">key=value<tspan class="muted" font-size="12.5" font-weight="400" dx="10">short column names, values as they are</tspan></text>
  <rect x="818" y="320" width="70" height="20" rx="10" fill="#CCFBF1"/>
  <text x="853" y="334" class="sans" font-size="11" font-weight="600" fill="#0F766E" text-anchor="middle">readable</text>
  <text x="356" y="374" class="mono ink" font-size="12.5">dst port=31992 proto=6 app proto=11.0 <tspan class="hl">in bytes=4704</tspan> in pkts=28 …</text>

  <!-- E4 -->
  <g filter="url(#shadow)"><rect x="340" y="404" width="560" height="86" rx="10" class="card"/></g>
  <rect x="356" y="418" width="34" height="22" rx="6" fill="#0F766E"/>
  <text x="373" y="434" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">E4</text>
  <text x="400" y="434" class="sans ink" font-size="15" font-weight="700">Sentence<tspan class="muted" font-size="12.5" font-weight="400" dx="10">a fixed English template</tspan></text>
  <rect x="818" y="418" width="70" height="20" rx="10" fill="#CCFBF1"/>
  <text x="853" y="432" class="sans" font-size="11" font-weight="600" fill="#0F766E" text-anchor="middle">readable</text>
  <text x="356" y="461" class="sans ink" font-size="13">A TCP flow with application protocol NFS to destination port 31992 lasted</text>
  <text x="356" y="479" class="sans ink" font-size="13">335 milliseconds. The client sent 28 packets (<tspan class="hl">4704 bytes</tspan>) over 334 milliseconds …</text>

  <!-- encodings -> language models (every model reads every encoding) -->
  <g fill="none" stroke="#184F95" stroke-width="1.6">
    <path d="M900,153 H940"/>
    <path d="M900,251 H940"/>
    <path d="M900,349 H940"/>
    <path d="M900,447 H940"/>
    <path d="M940,153 V447"/>
    <path d="M940,205 H976" marker-end="url(#arrow)"/>
    <path d="M940,345 H976" marker-end="url(#arrow)"/>
  </g>

  <!-- Small BERT -->
  <g filter="url(#shadow)"><rect x="980" y="160" width="190" height="90" rx="12" class="card"/></g>
  <rect x="980" y="160" width="6" height="90" rx="3" fill="#EB6834"/>
  <text x="998" y="188" class="sans ink" font-size="16" font-weight="700">Small BERT</text>
  <text x="998" y="210" class="sans muted" font-size="12.5">from scratch · 1.5 M params</text>
  <text x="998" y="227" class="sans muted" font-size="12.5">own BPE tokenizer per</text>
  <text x="998" y="243" class="sans muted" font-size="12.5">encoding</text>

  <!-- DistilBERT -->
  <g filter="url(#shadow)"><rect x="980" y="300" width="190" height="90" rx="12" class="card"/></g>
  <rect x="980" y="300" width="6" height="90" rx="3" fill="#1BAF7A"/>
  <text x="998" y="328" class="sans ink" font-size="16" font-weight="700">DistilBERT</text>
  <text x="998" y="350" class="sans muted" font-size="12.5">pretrained on English</text>
  <text x="998" y="367" class="sans muted" font-size="12.5">67 M params · fine-tuned</text>
  <text x="998" y="383" class="sans muted" font-size="12.5">WordPiece tokenizer</text>

  <!-- XGBoost baseline: reads the table, no text -->
  <path d="M165,470 V540 H976" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <rect x="470" y="528" width="310" height="24" rx="12" fill="#F8FAFC"/>
  <text x="625" y="545" class="sans muted" font-size="12.5" text-anchor="middle">baseline: no text, the table goes in as it is</text>
  <g filter="url(#shadow)"><rect x="980" y="505" width="190" height="70" rx="12" class="card"/></g>
  <rect x="980" y="505" width="6" height="70" rx="3" fill="#2A78D6"/>
  <text x="998" y="533" class="sans ink" font-size="16" font-weight="700">XGBoost</text>
  <text x="998" y="555" class="sans muted" font-size="12.5">tuned gradient-boosted trees</text>
</svg>
